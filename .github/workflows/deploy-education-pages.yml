name: Deploy Living Region education site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run carrying-capacity tests
        run: node --test --test-concurrency=1 packages/carrying-capacity/test/*.test.mjs
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Validate scenario and systemic-energy contracts
        run: npm run validate:all
      - name: Build the Pages site
        env:
          VITE_BASE_PATH: /living-region/
        run: npm run build:education
      - name: Validate education contract
        run: npm run validate:education
      - name: Verify Pages asset paths
        run: |
          grep -q 'src="/living-region/assets/' packages/education-web/dist/index.html
          grep -q 'href="/living-region/assets/' packages/education-web/dist/index.html
          test -f packages/education-web/dist/carrying-capacity/index.html
          test -f packages/education-web/dist/grey-county-transition/index.html
          test -f packages/education-web/dist/arc-affordability/index.html
          test -f packages/education-web/dist/house-cost/index.html
          test -f packages/education-web/dist/owen-sound-transit/index.html
          test -f packages/education-web/dist/owen-sound-local-representation/index.html
          test -f packages/education-web/dist/404.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: packages/education-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
