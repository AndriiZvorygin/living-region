services:
  hamlet-web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: living-region-hamlet-web:latest
    container_name: hamlet-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      canvassing-api:
        condition: service_healthy

  canvassing-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: canvassing-api
    image: living-region-canvassing-api:latest
    container_name: canvassing-api
    user: "1000:1000"
    restart: unless-stopped
    volumes:
      - ./private/canvassing:/app/private/canvassing
    environment:
      CANVASS_SECURE_COOKIES: "false"
      CANVASSING_SMTP_HOST: ${CANVASSING_SMTP_HOST:-}
      CANVASSING_SMTP_PORT: ${CANVASSING_SMTP_PORT:-587}
      CANVASSING_SMTP_SECURE: ${CANVASSING_SMTP_SECURE:-false}
      CANVASSING_SMTP_USER: ${CANVASSING_SMTP_USER:-}
      CANVASSING_SMTP_PASSWORD: ${CANVASSING_SMTP_PASSWORD:-}
      CANVASSING_FROM_EMAIL: ${CANVASSING_FROM_EMAIL:-}
      CANVASSING_ADMIN_EMAIL: ${CANVASSING_ADMIN_EMAIL:-}
      CANVASSING_REPLY_TO_EMAIL: ${CANVASSING_REPLY_TO_EMAIL:-}
      CANVASSING_BASE_URL: ${CANVASSING_BASE_URL:-http://localhost:5174}
    healthcheck:
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4174/api/canvassing/health',{headers:{authorization:'Bearer docker-private-canvassing'}}).then(r=>{if(!r.ok)process.exit(1)})"]
